[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "target-actionability"
version = "0.1.0"
description = "Target actionability for any trait (OpenTargets BigQuery + ChEMBL)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-cloud-bigquery>=3.46.1",
    "polars>=1.43.0",
]

[project.scripts]
target-tractability = "src.cli:TargetActionability"

[tool.setuptools]
packages = ["src"]
